<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d3fd1"><title>Apontamento da Obra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f4fa;color:#28222e}
header{background:#6d3fd1;color:#fff;padding:22px 18px;border-radius:0 0 24px 24px}main{max-width:650px;margin:auto;padding:16px}
h1{margin:0;font-size:22px}.muted{color:#777;font-size:13px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}
input,select,button{width:100%;padding:13px;border-radius:12px;font:inherit}input,select{border:1px solid #ddd6e8;background:#fff}button{border:0;font-weight:750;cursor:pointer}.primary{background:#6d3fd1;color:#fff}.secondary{background:#eee9f7;color:#503092}.danger{background:#fee8e8;color:#a32727}
.row{display:flex;gap:8px}.row>*{flex:1}.employee{border:1px solid #e5deed;border-radius:15px;padding:14px;margin:10px 0}.employee h3{font-size:16px;margin:0 0 9px}.num{color:#6d3fd1}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top button{width:auto}.success{background:#e8f8ee;color:#176b39;padding:12px;border-radius:12px;margin:10px 0}
</style></head>
<body><header><h1>🏗️ Apontamento da Obra</h1></header><main id="app"></main>
<script>
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{let [y,m,x]=d.split("-");return x+"/"+m+"/"+y};
async function api(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Ocorreu um erro.");return j}
async function start(){let m=await api("/api/me");m.role?home(m.role):login()}
function login(){app.innerHTML=`<div class="card"><h2>Entrar</h2><p class="muted">Use seu acesso de apontadora ou o acesso do encarregado.</p><input id="u" placeholder="Usuário"><br><br><input id="p" type="password" placeholder="Senha"><br><br><button class="primary" onclick="doLogin()">Entrar</button><p id="err"></p></div>`}
async function doLogin(){try{let j=await api("/api/login",{method:"POST",body:JSON.stringify({user:u.value,password:p.value})});home(j.role)}catch(e){err.textContent=e.message;err.style.color="#a22"}}
function head(title){return `<div class="top"><div><h2>${title}</h2></div><button class="secondary" onclick="logout()">Sair</button></div>`}
async function home(role){if(role==="admin")admin();else foreman()}
async function logout(){await api("/api/logout",{method:"POST"});login()}
async function foreman(){
 let days=await api("/api/foreman/days");
 app.innerHTML=head("👷 Encarregado")+`<div class="card"><label>Escolha o dia</label><select id="day" onchange="loadForeman()">${days.map(d=>`<option value="${d.id}">${fmt(d.date)}</option>`).join("")}</select></div><div id="form"></div>`;
 if(days.length)loadForeman();else form.innerHTML='<div class="card">Nenhum dia foi liberado pela apontadora.</div>';
}
async function loadForeman(){let j=await api("/api/foreman/day/"+day.value);form.innerHTML=`<div class="card"><h2>Serviços — ${fmt(j.day.date)}</h2><p class="muted">Preencha somente o serviço realizado por cada colaborador.</p>${j.employees.map((e,i)=>`<div class="employee"><h3><span class="num">${i+1}.</span> ${esc(e.name)}</h3><input data-id="${e.id}" value="${esc(e.service)}" placeholder="Ex.: Alvenaria"></div>`).join("")}<button class="primary" onclick="saveForeman()">✅ Enviar apontamento</button></div>`}
async function saveForeman(){let items=[...document.querySelectorAll("#form input[data-id]")].map(x=>({employee_id:+x.dataset.id,service:x.value}));try{await api("/api/foreman/day/"+day.value,{method:"POST",body:JSON.stringify({items})});form.insertAdjacentHTML("afterbegin",'<div class="success">Apontamento salvo com sucesso!</div>')}catch(e){alert(e.message)}}
async function admin(){let [emps,days]=await Promise.all([api("/api/employees"),api("/api/days")]);app.innerHTML=head("👩🏻‍💻 Apontadora")+`
<div class="card"><h2>Colaboradores</h2><div class="row"><input id="name" placeholder="Nome do colaborador"><button class="primary" onclick="addEmp()">Adicionar</button></div><div id="emps"></div></div>
<div class="card"><h2>Dias de apontamento</h2><div class="row"><input id="date" type="date"><button class="primary" onclick="addDay()">Criar dia</button></div><div id="days"></div></div>
<div class="card"><h2>Visualizar apontamento</h2><select id="viewday" onchange="viewDay()">${days.map(d=>`<option value="${d.id}">${fmt(d.date)}</option>`).join("")}</select><div id="view"></div></div>`;
renderLists(emps,days);if(days.length)viewDay()}
function renderLists(emps,days){empsEl= document.getElementById("emps");daysEl=document.getElementById("days");empsEl.innerHTML=emps.map(e=>`<div class="row" style="align-items:center;margin-top:8px"><span>${esc(e.name)}</span><button class="danger" onclick="delEmp(${e.id})">Remover</button></div>`).join("")||'<p class="muted">Nenhum colaborador.</p>';daysEl.innerHTML=days.map(d=>`<div class="row" style="align-items:center;margin-top:8px"><span>📅 ${fmt(d.date)}</span><button class="danger" onclick="delDay(${d.id})">Remover</button></div>`).join("")||'<p class="muted">Nenhum dia.</p>'}
async function addEmp(){if(!name.value.trim())return;try{await api("/api/employees",{method:"POST",body:JSON.stringify({name:name.value})});admin()}catch(e){alert(e.message)}}
async function delEmp(id){if(confirm("Remover colaborador?")){await api("/api/employees/"+id,{method:"DELETE"});admin()}}
async function addDay(){if(!date.value)return;try{await api("/api/days",{method:"POST",body:JSON.stringify({date:date.value})});admin()}catch(e){alert(e.message)}}
async function delDay(id){if(confirm("Remover este dia?")){await api("/api/days/"+id,{method:"DELETE"});admin()}}
async function viewDay(){let j=await api("/api/day/"+viewday.value);view.innerHTML=j.employees.map((e,i)=>`<div class="employee"><h3>${i+1}. ${esc(e.name)}</h3><span class="${e.service?"":"muted"}">${esc(e.service)||"Sem serviço preenchido"}</span></div>`).join("")}
start();
</script></body></html>
